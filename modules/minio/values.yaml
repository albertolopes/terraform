auth:
  existingSecret: minio-credentials

service:
  type: ClusterIP

defaultBuckets:
  - terraform-state
  - gitlab-lfs
  - gitlab-artifacts
  - gitlab-uploads
  - gitlab-packages

ingress:
  enabled: true
  ingressClassName: traefik
  hostname: minio.${domain_name}
  path: /

extraEnvVars:
  - name: MINIO_BROWSER_REDIRECT_URL
    value: https://minio.${domain_name}