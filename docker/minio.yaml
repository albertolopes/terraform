version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2023-09-04T20-10-40Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - "../volume/minio:/data"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  # Using host directory in ../volume/minio instead of named volume by default.
  # If you want to revert to a Docker named volume, uncomment the block below.
  # minio_data:
  #   driver: local

# Notes:
# - In production do not use the default credentials; supply via environment or secret management.
# - The image tag here is a dated RELEASE; update to a desired stable tag as needed.
