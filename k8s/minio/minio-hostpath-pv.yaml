# Fallback PV manifest — path is a placeholder and should NOT be used as-is.
# The deployment script `scripts/deploy_minio.sh` now creates the PV dynamically from the repo-relative
# directory: `${MODULE_DIR}/volume/minio`. Keep this file as a reference or for manual edits.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minio-hostpath
  labels:
    app: minio
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    # Replace this path if you want to manage the PV manifest manually.
    path: "/path/to/repo/volume/minio"
    type: DirectoryOrCreate
