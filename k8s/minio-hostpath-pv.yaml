  labels:
    app: minio
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: "/home/beto/Documentos/aaa-pessoal/terraform/volume/minio"
    type: DirectoryOrCreate

