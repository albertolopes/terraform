apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-postgres-hostpath
  labels:
    app: postgres
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: "${PWD}/volume/postgres/data"
    type: DirectoryOrCreate
