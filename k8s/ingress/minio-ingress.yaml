apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-host-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    # If you use cert-manager, set the cluster-issuer here (example):
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # NGINX ingress controller tuning for larger uploads (S3-like traffic)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  # TLS section: create a TLS secret named `minio-tls` (or use cert-manager with the annotation above)
  tls:
  - hosts:
    - minio.example.local
    secretName: minio-tls

  rules:
  - host: minio.example.local
    http:
      paths:
      # Console (web UI) - route root '/' to console port (9001)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9001
      # MinIO API - route /minio or /api to API port (9000). Adjust path to taste.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
      - path: /minio
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9000
