apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio-host-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik # DEFINIÇÃO EXPLÍCITA
  tls:
    - hosts:
        - minio.avocado.tail799250.ts.net
        - minio-console.avocado.tail799250.ts.net
      secretName: tailscale-certs
  rules:
    - host: minio.avocado.tail799250.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
    - host: minio-console.avocado.tail799250.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9001
