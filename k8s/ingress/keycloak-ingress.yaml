apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-host-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
    # Removido cert-manager pois não funciona para domínios .ts.net
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - keycloak.avocado.tail799250.ts.net
      secretName: tailscale-certs # Usa o certificado que temos (dará erro de nome, mas o 404 some)
  rules:
    - host: keycloak.avocado.tail799250.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
