apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-host-ingress
  namespace: default
  annotations:
    # Anotações para compatibilidade
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik # DEFINIÇÃO EXPLÍCITA
  tls:
    - hosts:
        - keycloak.avocado.tail799250.ts.net
      secretName: tailscale-certs
  rules:
    - host: keycloak.avocado.tail799250.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
